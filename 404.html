<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldPlus</title>
<script src="/goldplus/config.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5f1; color: #1d2230;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
  a { color: #a8861c; }
</style>
</head>
<body>
<p id="message">Yönlendiriliyor...</p>
<script>
  // Table QR codes point here (emre2026.github.io/goldplus/m/ABC123), an address that never changes.
  // This page sends the guest on to wherever the GoldPlus server is today (sunucu.json), so moving the
  // server never means printing the table QR codes again.
  (function () {
    var match = location.pathname.match(/\/m\/([A-Za-z0-9]{6})\/?$/);
    if (!match) {
      location.replace("/goldplus/");
      return;
    }

    var code = match[1].toUpperCase();
    var fallback = (window.GOLDPLUS && window.GOLDPLUS.cloudUrl) || "";

    function go(base) {
      if (!base) {
        document.getElementById("message").innerHTML =
          'Masa bağlantısı şu an açılamıyor. <a href="/goldplus/menu.html">Menüye göz at</a>';
        return;
      }
      location.replace(base.replace(/\/+$/, "") + "/m/" + code);
    }

    fetch("/goldplus/sunucu.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (config) { go(config.cloudUrl || fallback); })
      .catch(function () { go(fallback); });
  })();
</script>
</body>
</html>
